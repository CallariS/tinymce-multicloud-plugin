# Cloudflare Worker Configuration
# This file makes it easier to deploy the Nextcloud proxy worker
# See docs/CLOUDFLARE_WORKER_SETUP.md for setup instructions

name = "nextcloud-proxy"
main = "cloudflare-worker/nextcloud-proxy.js"
compatibility_date = "2024-01-01"

# Workers Free tier limits
# - 100,000 requests/day
# - 10ms CPU time per request

[build]
command = ""

# Environment variables — set ALLOWED_TARGET_HOSTS to restrict which Nextcloud
# hostnames the proxy will forward to (recommended for production).
# Leave empty to allow any HTTPS host (suitable for personal/demo use only).
# Example: "nextcloud.example.com,cloud.example.org"
[vars]
ALLOWED_TARGET_HOSTS = ""

[env.production]
name = "nextcloud-proxy"

[env.development]
name = "nextcloud-proxy-dev"
