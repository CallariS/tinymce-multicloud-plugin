    <textarea id="editor"><h1>TinyMCE MultiCloud Plugin &mdash; Live Demo</h1>
<p>This editor demonstrates the <strong>TinyMCE MultiCloud Plugin</strong>, which lets you browse, pick and embed files from multiple cloud storage providers directly into your content.</p>
<h2>How To</h2>
<ul>
<li>Click <span style="display: inline-flex; align-items: center; gap: 4px; vertical-align: middle; border-radius: 3px; border: 1px solid black; box-shadow: 0 0 .25em black; padding: 2px 6px; font-size: 0.85em;"><img style="vertical-align: middle;" src="blob:https://callaris.github.io/3f10e84e-56db-4483-9050-95f0d641a265" alt="insert" width="16" height="16"></span> in the toolbar to browse and pick a file from a connected cloud provider.</li>
<li>Click <span style="display: inline-flex; align-items: center; gap: 4px; vertical-align: middle; border-radius: 3px; box-shadow: 0 0 .25em black; border: 1px solid black; padding: 2px 6px; font-size: 0.85em;"><img style="vertical-align: middle;" src="blob:https://callaris.github.io/2975fccc-e6ca-4bbb-add7-1282c25d9b3e" alt="upload" width="16" height="16"></span> to upload a local file to a cloud provider and insert it.</li>
<li>Files are automatically embedded as images, audio players, video players, or document viewers depending on their type &mdash; <em>or inserted as links when embedding is not supported by a provider</em>.</li>
</ul>

    <script>
      const fallbackConfig = {
        providers: {
          googleDrive: { enabled: true, pickerUrl: "./pickers/google-drive.html" },
          oneDrive: { enabled: true, pickerUrl: "./pickers/onedrive.html" },
          dropbox: { enabled: true, pickerUrl: "./pickers/dropbox.html" },
          bayerncloud: { enabled: true, pickerUrl: "./pickers/bayerncloud.html" },
        },
        defaultProvider: "googleDrive",
        defaultInsertMode: "link",
        dialogTitle: "Insert From Cloud",
        popupTimeoutMs: 120000,
      };

      const config = window.MULTICLOUD_CONFIG || fallbackConfig;

      // Calculate editor height based on window size with margins
      const calculateEditorHeight = () => {
        return window.innerHeight - 40; // 20px margin top + 20px margin bottom
      };

      tinymce.init({
        selector: "#editor",
        height: calculateEditorHeight(),
        plugins: "link image media code multicloud",
        toolbar:
          "undo redo | styles | bold italic | alignleft aligncenter alignright | link image media | multicloud multicloud_upload | code",
        multicloud_providers: config.providers,
        multicloud_default_provider: config.defaultProvider,
        multicloud_default_insert_mode: config.defaultInsertMode,
        multicloud_dialog_title: config.dialogTitle,
        multicloud_popup_timeout_ms: config.popupTimeoutMs,
        setup: (editor) => {
          // Handle window resize
          window.addEventListener('resize', () => {
            const newHeight = calculateEditorHeight();
            // Use the container resize method instead of deprecated theme.resizeTo
            if (editor.getContainer()) {
              editor.getContainer().style.height = newHeight + 'px';
            }
          });
        },
      });
    </script>
