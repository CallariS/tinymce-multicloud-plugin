<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Drive Picker Mock</title>
  </head>
  <body>
    <h2>Google Drive Picker Mock</h2>
    <button id="insert">Insert image</button>
    <button id="cancel">Cancel</button>
    <script>
      const providerId = "googleDrive";
      const post = (type, payload) => {
        window.opener?.postMessage(
          {
            source: "tinymce-multicloud-plugin",
            type,
            providerId,
            payload,
          },
          "*",
        );
        window.close();
      };

      document.getElementById("insert").onclick = () => {
        post("picked", {
          item: {
            id: "g-1",
            name: "Google Drive Image",
            url: "https://images.pexels.com/photos/574071/pexels-photo-574071.jpeg",
          },
          mode: "image",
        });
      };

      document.getElementById("cancel").onclick = () => post("cancelled");
    </script>
  </body>
</html>
