name: Worker Health Check

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health endpoint
        run: |
          WORKER_URL="${{ vars.CLOUDFLARE_WORKER_URL }}"
          if [ -z "$WORKER_URL" ]; then
            echo "CLOUDFLARE_WORKER_URL not set — skipping health check"
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${WORKER_URL}/health")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Cloudflare Worker health check failed (HTTP $STATUS). Check the Worker at ${WORKER_URL}"
            exit 1
          fi
          echo "Worker is healthy."
