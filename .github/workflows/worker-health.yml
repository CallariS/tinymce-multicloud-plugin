name: Worker Health Check

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    # Skip silently if the worker URL repository variable has not been configured
    if: vars.CLOUDFLARE_WORKER_URL != ''
    steps:
      - name: Ping /health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.CLOUDFLARE_WORKER_URL }}/health")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Cloudflare Worker health check failed (HTTP $STATUS). Check the Worker at ${{ vars.CLOUDFLARE_WORKER_URL }}"
            exit 1
          fi
