name: Check Demo Links

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC every day
  workflow_dispatch:       # also triggerable manually

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check URLs
