name: Check Demo Links

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC every day
  workflow_dispatch:       # also triggerable manually

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check URLs
        run: |
          URLS=(
            # ── Demo pages ────────────────────────────────────────────────────
            "https://callaris.github.io/tinymce-multicloud-plugin/demo/tinymce-demo.html"
            "https://callaris.github.io/tinymce-multicloud-plugin/demo/privacy-policy.html"
            "https://callaris.github.io/tinymce-multicloud-plugin/demo/terms-of-service.html"

            # ── Google Drive ──────────────────────────────────────────────────────────────
