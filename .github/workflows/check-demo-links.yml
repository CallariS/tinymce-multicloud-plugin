            "https://1drv.ms/b/c/b1be7ad0cd77c81c/IQQ7lABnBWFdTrMR6rDo1BxPAWksi0rczKdjt6h0xk-PWGQ"
            "https://onedrive.live.com?cid=b1be7ad0cd77c81c&id=B1BE7AD0CD77C81C!sdd015aea46f64fc891f1ab9d81bddada"
            "https://1drv.ms/w/c/b1be7ad0cd77c81c/IQTSExjQztaJS6YxG_6-hYfSAVYnFgnTvGIoW1T57HiPo7o"
            "https://1drv.ms/u/c/b1be7ad0cd77c81c/IQRMzaLzt1FuRpKuEs0-o-y3Ab4no8KRcH4ZKJ0OyWPTOuw"
            "https://1drv.ms/i/c/b1be7ad0cd77c81c/IQQbWWCZ7YMNTJm7S4AE9IfkAfmWtH497vv_S-LFxcv_vIA"
            "https://1drv.ms/i/c/b1be7ad0cd77c81c/IQQrGYA_71saT6T3MWNkyKS8AbWU7H0G5uFATXH0qnFF-MY"

            # ── Dropbox ───────────────────────────────────────────────────────
            "https://www.dropbox.com/scl/fi/wq0ozxuyzt4q4kgxykns8/CodBi.svg?rlkey=fu9f44yzopoyonc8zb139nl4q&raw=1"
            "https://www.dropbox.com/scl/fi/nqxjpmzkla9ltkvs4yuzf/file_example_MP3_700KB.mp3?rlkey=x8mq6k7h55qt73h3wv90nua3l&raw=1"
