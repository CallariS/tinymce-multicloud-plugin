            # ── Nextcloud ─────────────────────────────────────────────────────
            "https://fie.nl.tab.digital/s/a5DXk35LNwNjXKf/download"
            "https://fie.nl.tab.digital/s/gZHN74nmzPft9sk/download"
            "https://fie.nl.tab.digital/s/gnAYMSn7ZJJW56m/download"
            "https://fie.nl.tab.digital/s/CWKrZyAtnWAjKmX/download"
            "https://fie.nl.tab.digital/s/ZoeQAHQ2YJD5bwi/download"
            "https://fie.nl.tab.digital/s/KML3LtkQFgBQPxM/download"
            "https://fie.nl.tab.digital/s/LtqdSKXiXtABGMW/download"
            "https://fie.nl.tab.digital/s/MX2YsDB3wRbzKBs/download"
            "https://fie.nl.tab.digital/s/iiB3W5qe5rf5CJH/download"
            "https://fie.nl.tab.digital/s/PL6J2BsDkjLa2NF/download"
          )

          FAILED=0
          FAILED_URLS=()

          for URL in "${URLS[@]}"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 20 --location --retry 2 "$URL")
            if [[ "$STATUS" =~ ^[23] ]]; then
              echo "OK   $STATUS  $URL"
            else
              echo "FAIL $STATUS  $URL"
              FAILED_URLS+=("$URL  →  HTTP $STATUS")
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "──────────────────────────────────────"
            echo "Broken links detected:"
            for U in "${FAILED_URLS[@]}"; do
              echo "  ✗ $U"
            done
            echo "──────────────────────────────────────"
            exit 1
          fi

          echo "All ${#URLS[@]} links OK."
