            "https://fie.nl.tab.digital/s/5kbB7yqKPdAg2Aw/download"
            "https://fie.nl.tab.digital/s/owqGmbrmTQxSiNp/download"
            "https://fie.nl.tab.digital/s/dFa4rLLGXajoYEG/download"
            "https://fie.nl.tab.digital/s/zYf5Ak9d89GYWed/download"
            "https://fie.nl.tab.digital/s/D5o7Cne5ZX2dnSZ/download"
            "https://fie.nl.tab.digital/s/MNmiC2n6ED5zH3m/download"
            "https://fie.nl.tab.digital/s/GY2r3gGdaBLwrMm/download"
            "https://fie.nl.tab.digital/s/cGTK7WKfdESdzr3/download"
            "https://fie.nl.tab.digital/s/FA8fas6FPFjYKZg/download"
          )

          FAILED=0
          FAILED_URLS=()

          for URL in "${URLS[@]}"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 20 --location --retry 2 "$URL")
            if [[ "$STATUS" =~ ^[23] ]]; then
              echo "OK   $STATUS  $URL"
            else
              echo "FAIL $STATUS  $URL"
              FAILED_URLS+=("$URL  →  HTTP $STATUS")
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "──────────────────────────────────────"
            echo "Broken links detected:"
            for U in "${FAILED_URLS[@]}"; do
              echo "  ✗ $U"
            done
            echo "──────────────────────────────────────"
            exit 1
          fi

          echo "All ${#URLS[@]} links OK."


          FAILED=0
          FAILED_URLS=()

          for URL in "${URLS[@]}"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 20 --location --retry 2 "$URL")
            if [[ "$STATUS" =~ ^[23] ]]; then
              echo "OK   $STATUS  $URL"
            else
              echo "FAIL $STATUS  $URL"
              FAILED_URLS+=("$URL  →  HTTP $STATUS")
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "──────────────────────────────────────"
            echo "Broken links detected:"
            for U in "${FAILED_URLS[@]}"; do
              echo "  ✗ $U"
            done
            echo "──────────────────────────────────────"
            exit 1
          fi

          echo "All ${#URLS[@]} links OK."
