            "https://drive.google.com/thumbnail?id=1-eJTdbDRMJqrC7Mc1erxp17U-CAj31jF&sz=w2000"
            "https://drive.google.com/file/d/1T_CqXjd8r4oYh4U9LRt74ymkRvgtvJOu/preview"
            "https://drive.google.com/file/d/1hrLcStthxyubGlRKuM3yPi73_KvSEkts/preview"
            "https://drive.google.com/file/d/1mbPA8tPfv0idtKl94Ns17tb_x9T6u7iM/preview"
            "https://drive.google.com/thumbnail?id=1N41uP1StSqjH76--b0spf7lZVoIY7eT5&sz=w2000"
            "https://drive.google.com/thumbnail?id=1OQ4BHtwrYYeYS9evIrGKdqS2S-AoD1lw&sz=w2000"
            "https://drive.google.com/file/d/14OefWr90LotEdOTVJxDXPc1eZqehCCXp/preview"
